[package]
name = "redcolor"
version = "2.0.0"
edition = "2024"
description = "RedColor - PDF editor for checking student works"
authors = ["Maksim Belonoskin, Zelenograd, Moscow, Russia"]

[dependencies]
mupdf = "0.8.0"
slint = "1.18.1"
rfd = "0.15"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
interprocess = "2"
winreg = "0.55"
png = "0.17"
base64 = "0.22"
arboard = { version = "3", default-features = false, features = ["image-data"] }
clipboard-win = "5"

[patch.crates-io]
mupdf-sys = { path = "vendor/mupdf-sys" }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"


